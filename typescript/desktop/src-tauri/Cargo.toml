[package]
name = "circuitjs1-desktop"
version = "0.1.0"
description = "Tauri desktop wrapper for the CircuitJS1 TypeScript migration"
authors = ["CircuitJS1 contributors"]
license = "GPL-2.0-or-later"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "circuitjs1_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
